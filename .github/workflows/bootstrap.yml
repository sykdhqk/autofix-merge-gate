name: Bootstrap repository
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  publish:
    if: github.actor == 'sykdhqk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified source and tag
        env:
          PAYLOAD_B64: |
            
        run: |
          printf '%s' "$PAYLOAD_B64" | base64 -d > /tmp/autofix-bootstrap.tar.gz
          mkdir -p /tmp/autofix-source
          tar -xzf /tmp/autofix-bootstrap.tar.gz -C /tmp/autofix-source
          rsync -a /tmp/autofix-source/ ./
          git rm --force .github/workflows/bootstrap.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish Autofix Merge Gate v1.0.0"
          git push origin HEAD:main
          git tag -a v1.0.0 -m "Autofix Merge Gate 1.0.0"
          git push origin v1.0.0
